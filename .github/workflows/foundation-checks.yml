name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify initial design documents
        run: |
          test -s README.md
          test -s docs/ARCHITECTURE_V1.md
          test -s docs/DATA_SOURCES.md
          test -s docs/RELEASES.md
      - name: Verify release workflow is not auto-enabled
        run: |
          if test -e .github/workflows/publish-files.yml; then
            echo 'A publish workflow has been added; review its trigger and secret handling before merging.'
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline contract tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

