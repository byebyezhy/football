name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify initial design documents
        run: |
          test -s README.md
          test -s docs/ARCHITECTURE_V1.md
          test -s docs/DATA_SOURCES.md
          test -s docs/RELEASES.md
          test -s docs/DEPLOY_VPS.md
      - name: Verify release workflow is not auto-enabled
        run: |
          if test -e .github/workflows/publish-files.yml; then
            echo 'A publish workflow has been added; review its trigger and secret handling before merging.'
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web and HTTP test dependencies
        run: python -m pip install -e '.[web,test]'
      - name: Run offline contract tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests scripts

  verify-runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root runtime image with native TLS library
        run: docker build -t football-runtime-smoke .
      - name: Verify Soccerdata can initialize without writing to site-packages
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint python \
            football-runtime-smoke -c 'from tls_requests.models.libraries import TLSLibrary; TLSLibrary.load(); import soccerdata; print("non-root TLS library ready")'

