name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify initial design documents
        run: |
          test -s README.md
          test -s docs/ARCHITECTURE_V1.md
          test -s docs/DATA_SOURCES.md
          test -s docs/RELEASES.md
          test -s docs/DEPLOY_VPS.md
      - name: Verify release workflow keeps uploads away from pull requests
        run: |
          test -s .github/workflows/publish-files.yml
          if grep -q '^  pull_request:' .github/workflows/publish-files.yml; then
            echo 'Release workflow must never run with deployment secrets on pull requests' >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web and HTTP test dependencies
        run: python -m pip install -e '.[web,test]'
      - name: Run offline contract tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests scripts

  verify-runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose with worker enabled
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config --quiet
      - name: Build non-root runtime image with native TLS library
        run: docker build -t football-runtime-smoke .
      - name: Verify Soccerdata can initialize without writing to site-packages
        run: |
          docker run --rm --read-only --network none --tmpfs /tmp \
            -e SOCCERDATA_DIR=/tmp/football-soccerdata \
            -e MPLCONFIGDIR=/tmp/football-matplotlib --entrypoint python \
            football-runtime-smoke -c 'from tls_requests.models.libraries import TLSLibrary; TLSLibrary.load(); import soccerdata; print("non-root TLS library ready")'

  verify-postgresql-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_ci
          POSTGRES_USER: football_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football_ci -d football_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database test dependencies
        run: python -m pip install -e '.[web,test]'
      - name: Verify existing results and additive V0.3 tables on PostgreSQL 16
        env:
          FOOTBALL_TEST_DATABASE: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: football_ci
          DB_USER: football_ci
          DB_PASSWORD: ci-only-password
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_postgres_integration.py' -v

