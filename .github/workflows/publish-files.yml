name: Build and optionally publish football release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable source release version, e.g. v0.1.0'
        required: true
        default: v0.1.0
        type: string
      channel:
        description: 'Channel pointer to update only after HTTPS verification'
        required: true
        default: test
        type: choice
        options: [test, stable]
      operation:
        description: 'Build only, create a new immutable release, or point a channel at an existing release'
        required: true
        default: build-only
        type: choice
        options: [build-only, publish-new, promote-existing]

# A merge to main automatically creates a unique, immutable test release.
# workflow_dispatch remains available for exact-version builds and stable releases.
env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && format('v0.2.{0}', github.run_number) || inputs.version }}
  RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'test' || inputs.channel }}
  RELEASE_OPERATION: ${{ github.event_name == 'push' && 'publish-new' || inputs.operation }}

permissions:
  contents: read

concurrency:
  group: football-files-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ref and semantic version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_VERSION" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == "refs/tags/$RELEASE_VERSION" ]]
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web dependencies for release validation
        run: python -m pip install -e '.[web,test]'
      - name: Run offline tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build allow-listed source archive
        run: |
          python -m scripts.build_release --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: football-${{ env.RELEASE_VERSION }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' || inputs.operation != 'build-only' }}
    needs: package
    runs-on: ubuntu-latest
    # Credentials remain in repository-level Actions Secrets, never in the release archive.
    # Only main pushes or a manually dispatched workflow can reach this job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: football-${{ env.RELEASE_VERSION }}
          path: dist
      - name: Write credentials with verified host key
        shell: bash
        env:
          FILES_SSH_KEY: ${{ secrets.FILES_SSH_KEY }}
          FILES_KNOWN_HOSTS: ${{ secrets.FILES_KNOWN_HOSTS }}
          FILES_SSH_USER: ${{ secrets.FILES_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$FILES_SSH_KEY" && test -n "$FILES_KNOWN_HOSTS" && test -n "$FILES_SSH_USER"
          umask 077
          printf '%s\n' "$FILES_SSH_KEY" > "$RUNNER_TEMP/football-files-key"
          printf '%s\n' "$FILES_KNOWN_HOSTS" > "$RUNNER_TEMP/football-files-known-hosts"
          chmod 600 "$RUNNER_TEMP/football-files-key" "$RUNNER_TEMP/football-files-known-hosts"
      - name: Upload, verify public SHA256, and activate channel
        env:
          FILES_SSH_USER: ${{ secrets.FILES_SSH_USER }}
        run: |
          python -m scripts.publish_files \
            --dist dist --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" \
            --operation "$RELEASE_OPERATION" \
            --ref "$GITHUB_REF" \
            --key-file "$RUNNER_TEMP/football-files-key" \
            --known-hosts "$RUNNER_TEMP/football-files-known-hosts"
