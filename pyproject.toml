[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "0.2.0.dev0"
description = "Extensible football score probability prediction platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Football project contributors"}]
dependencies = []

[project.optional-dependencies]
data = ["soccerdata>=1.9"]
model = ["penaltyblog", "pandas"]
all = ["soccerdata>=1.9", "penaltyblog", "pandas"]
web = ["fastapi>=0.116,<1", "starlette>=0.46,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4"]
test = ["httpx>=0.27,<1"]

[project.scripts]
football = "football_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"football_predictor.web" = ["static/*.html"]

